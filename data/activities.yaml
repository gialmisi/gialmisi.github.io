positions:
  - position: Member
    organization: Young Academy Finland (Nuorten Tiedeakatemia)
    period: "2026–2030"
    details: >
      Young Academy Finland gathers early-career researchers from all fields of
      science to promote the role of science in society and to advance the
      position of young researchers. I was elected as one of the 20 new members
      for the four-year term starting at the autumn general meeting in September
      2026.
    include: [website, cv]
  - position: Member of the Faculty Council
    organization: Faculty of Information Technology, University of Jyväskylä
    period: "2026, ongoing"
    details: >
      As a member of the Faculty Council, I contribute to the
      strategic planning and decision-making at the Faculty of
      Information Technology.
    include: [website, cv]
  - position: Alternate Member of the University Collegium
    organization: University of Jyväskylä
    period: "2026, ongoing"
    details: >
      As an alternate member of the University Collegium, I participate
      in the highest decision-making body of the university.
    include: [website, cv]
  - position: EURO Representative
    organization: The Finnish Operations Research Society, Association of European Operational Research Societies
    period: 2024, ongoing
    details: >
      As representative, I represent the Finnish Operations Research Society on
      an international level. I take part in the yearly board meeting of the
      Association of European Operational Research Societies (EURO). I hold the
      right to vote in the yearly board meeting of EURO.
    include: [website, cv]
  - position: Treasurer
    organization: The Finnish Operations Research Society
    period: "2024, ongoing"
    details: >
      As treasurer, I am responsible for the finances of the society.
      I am also a member of the society's current board.
    include: [website, cv]
  - position: President
    organization: The Finnish Operations Research Society
    period: 2023
    details: >
      As president, I was in charge calling board meetings and making sure the
      board promoted the interests of operation research researchers,
      practitioners, and enthusiast residing in Finland. I was also the main
      coordinator of the FORS50 conference, which was held at the University of
      Jyväskylä in honor of the 50-year-anniversary of the society.
    include: [website, cv]

rewards:
  - name: "Finalist, MCDM Doctoral Dissertation Award"
    date: 2026
    organization: "28th International Conference on Multiple Criteria Decision Making, Wuppertal, Germany"
    details: >
      Selected as one of four finalists for the MCDM Doctoral Dissertation
      Award of the International Society on Multiple Criteria Decision Making.
      The award recognizes outstanding doctoral dissertation research in the
      development of theory, methodology, and/or the application of theory or
      methodology to MCDM. The finalists presented their work in the Doctoral
      Dissertation Award Session of the conference.
    include: [website, cv]
  - name: "Good Dissertation Award (Hyvä väitöskirja -palkinto)"
    date: 2025
    organization: "University of Jyväskylä Foundation"
    details: >
      The award, consisting of 3000 euros, is given for a meritorious
      dissertation that brings together research methods and results in an
      insightful and versatile way. The recipient is nominated by the
      University of Jyväskylä Science Council.
    include: [website, cv]
  - name: "Runner-up, MCDM Junior Researcher Best Paper Award"
    date: 2025
    organization: "2025 INFORMS Annual Meeting, Atlanta, United States"
    details: >
      Runner-up in the MCDM Junior Researcher Best Paper competition
      at the 2025 INFORMS Annual Meeting.
    include: [website, cv]
  - name: "Finalist in the PhD Olympiad"
    date: 2025
    organization: "8th ECCOMAS Young Investigators Conference and PhD Olympiad 2025, Pescara, Italy"
    details: >
      Selected as a finalist in the PhD Olympiad at the 8th ECCOMAS Young
      Investigators Conference. Presented research on the role and potential
      of explainability in interactive multiobjective optimization.
    include: [website, cv]
  - name: >-
      Award for best pitch related to information and communication technology or
      telecommunications
    date: 2022
    organization: Millenium Graduate Student Contest
    details: >
      The reward was given by the Nokia Foundation, and consisted of a
      certificate and cash reward of 5000 euros. The finalists gave the pitch
      live during the Millennium Innovation Forum 2022.  The pitch I gave during
      the event can be viewed on
      [YouTube](https://www.youtube.com/watch?v=Rt1YKWaNG94).
    include: [website, cv]

